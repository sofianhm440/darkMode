<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>DarkMode</title>
</head>

<body>
    <div class="container">
        <nav>
            <a onclick="reRender()" id="home">HOME</a>
            <a onclick="darkMode()" id="mode">MODE</a>
            <!-- <a onclick="coolMode()" id="cool">COOL</a> -->
        </nav>
        <h1>HELLOOO WORLDDD</h1>
        <P class="info" id="info"></P>
    </div>

    <!-- initializing function script -->
    <script>
        let body = document.body;
        let info = document.getElementById("info");
        let mode = document.getElementById("mode");
        let home = document.getElementById("home");

        const darkLimit = 5;
        let darkCounter = 0;
        let darkRemainingLeft;

        function darkMode() {
            if (darkRemainingLeft == 1) {
                info.textContent = "FITUR DARKMODE TELAH HABIS";
                mode.style.display = "none";
                home.textContent = "RESTART";
                return;
            }
            darkCounter += 1;
            darkRemainingLeft = darkLimit - darkCounter;

            //  render ke info element
            info.textContent = `Darkmode digunakan sebanyak ${darkCounter}x, tersisa ${darkRemainingLeft}x`

            body.classList.toggle('dark'); 

            // if (body.classList.contains('dark')) {
            //     mode.textContent = "LIGHT MODE";
            // } else {
            //     mode.textContent = "DARK MODE";
            // }
        }

        function reRender() {
            location.reload();
        }
    </script>
</body>

</html>
